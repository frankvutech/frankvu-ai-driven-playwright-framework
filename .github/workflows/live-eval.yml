name: Live model evaluation

# Calls a paid model API. Runs only when someone starts it by hand, in an
# environment that holds the provider credential.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Model id
        default: claude-opus-5-5
      effort:
        description: Effort level (low | medium | high | xhigh | max)
        default: high
      repeat:
        description: Repetitions per case (to measure variability)
        default: '3'
      judge_model:
        description: Optional semantic-judge model (must differ from the evaluated model); empty to skip
        default: ''

permissions:
  contents: read

jobs:
  live-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: llm-eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Live evaluation (planning, generation, static validation, failure analysis; no execution)
        run: npm run eval:live -- --repeat "$REPEAT" ${JUDGE_MODEL:+--judge-model "$JUDGE_MODEL"}
        env:
          AGENT_LIVE_EVAL: '1'
          AGENT_MODEL: ${{ inputs.model }}
          AGENT_EFFORT: ${{ inputs.effort }}
          REPEAT: ${{ inputs.repeat }}
          JUDGE_MODEL: ${{ inputs.judge_model }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: live-eval
          path: eval-results/
          retention-days: 30
