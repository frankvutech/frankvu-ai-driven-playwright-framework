name: Playwright

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Agent unit tests (mock provider, no network)
        run: npm run test:agent
      - name: Playwright UI/API tests and agent integration (approved demo target)
        run: npx playwright test --project=setup --project=ui-chromium --project=api --project=agent-integration
      - name: Deterministic evaluation
        run: npm run eval
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            test-results/
            eval-results/
          retention-days: 14
