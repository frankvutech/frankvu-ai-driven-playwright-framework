name: Playwright

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - name: Framework self-tests (configuration validation, no network)
        run: npm run test:framework
      - name: Agent unit tests (mock provider, no network)
        run: npm run test:agent
      - name: Evaluation framework tests (dataset schema, metrics, fault injection, report schema)
        run: npm run test:eval
      - name: Deterministic evaluation (gated against eval/baselines/deterministic.json)
        run: npm run eval
      - name: Playwright UI, API and UI+API integration tests, and agent integration (approved demo target)
        run: npx playwright test --project=setup --project=ui-chromium --project=api --project=integration --project=agent-integration
      - name: Verify seeded-defect reference labels on the demo target
        run: npm run eval:probe-defects
      - name: Functional evaluation on seeded defects (gated against eval/baselines/functional.json)
        run: npm run eval:functional
        env:
          # Executes only the sha256-pinned dataset specs; the approver is the person whose push or PR triggered the run.
          AGENT_EVAL_APPROVER: ${{ github.actor }}
      - name: Healing evaluation on the local example app (recorded proposals; safety gates; gated against eval/baselines/healing.json)
        run: npm run eval:healing
        env:
          AGENT_EVAL_APPROVER: ${{ github.actor }}
      - name: Generate Allure HTML report
        if: ${{ always() }}
        run: npm run report:allure
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-evidence
          path: |
            playwright-report/
            allure-results/
            allure-report/
            test-results/
            eval-results/
            .agent/runs/
          retention-days: 14
